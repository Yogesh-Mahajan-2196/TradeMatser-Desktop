<div class="flex items-center justify-between">
  <div>
    <h2 class="text-lg font-bold text-slate-800">Active Stock Summary</h2>
  </div>

  <a href="/stock-summary" class="text-sm font-semibold text-blue-600">
    View All
  </a>
</div>

<div class="mt-5 overflow-x-auto">
  <table class="w-full min-w-105 text-left text-sm">
    <thead>
      <tr class="border-b border-slate-200 text-slate-500">
        <th class="pb-3 font-medium">Product</th>
        <th class="pb-3 font-medium">Current Stock</th>
        <th class="pb-3 font-medium">Unit</th>
        <th class="pb-3 font-medium">Avg. rate</th>
        <th class="pb-3 font-medium">Value</th>
      </tr>
    </thead>

    <tbody>
      {% for stock in stock_summary_data %}

      <tr class="border-b border-slate-100">
        <td class="py-3 font-semibold text-slate-700">
          {{ stock.product_name }}
        </td>
        <td class="py-3 text-slate-600">
            {{ stock.quantity }}
        </td>
        <td class="py-3 text-slate-600">
            {{stock.unit}}
        </td>
        <td class="py-3 text-slate-600">
            {{stock.average_rate}}
        </td>
        <td class="py-3 font-semibold text-slate-800">
          ₹{{ stock.total_value }}
        </td>
      </tr>

      {% else %}

      <tr>
        <td colspan="3" class="py-8 text-center text-slate-500">
          No stock data found.
        </td>
      </tr>

      {% endfor %}
    </tbody>
  </table>
</div>
