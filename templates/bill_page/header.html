<header
  x-data="{ userMenuOpen: false }"
  class="app-header w-full border-b border-emerald-900 bg-emerald-950"
>
  <!-- =========================================================
         TOP HEADER
         Mobile / Tablet : FLEX
         Desktop         : 3 COLUMN GRID
         ========================================================= -->

  <div
    class="flex w-full h-20 items-center justify-between px-5 sm:px-8 lg:grid lg:grid-cols-3 lg:h-22 lg:px-10 xl:px-12"
  >
    <!-- =====================================================
             LEFT : LOGO + PROJECT NAME
             ===================================================== -->

    <div class="min-w-0 flex-1 lg:flex-none">
      <a href="/dashboard" class="flex min-w-0 items-center gap-3">
        <!-- LOGO -->

        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center  border-amber-400 text-xl text-amber-400"
        >
          🌾
        </div>

        <!-- PROJECT NAME -->

        <div class="min-w-0 leading-tight">
          <div
            class="truncate text-lg font-bold tracking-tight text-white sm:text-xl lg:text-2xl"
          >
            MyTradeMaster
          </div>

          <div class="mt-1 text-xs text-emerald-200 sm:text-sm">
            Grain Merchant
          </div>
        </div>
      </a>
    </div>

    <!-- =====================================================
             CENTER : DESKTOP NAVIGATION ONLY
             ===================================================== -->

    <nav class="hidden items-center justify-between gap-8 lg:flex">
      {% if current_user.role_id.value != "USER" %}
      <a
        href="/dashboard"
        class="whitespace-nowrap text-sm font-semibold text-white transition hover:text-emerald-300"
      >
        Dashboard
      </a>
      {% endif %}

      <a
        href="/purchase-bill"
        class="whitespace-nowrap text-sm font-semibold text-white transition hover:text-emerald-300"
      >
        Purchase Bill
      </a>

      <a
        href="/sell-bill"
        class="whitespace-nowrap text-sm font-semibold text-white transition hover:text-emerald-300"
      >
        Sell Bill
      </a>
    </nav>

    <!-- =====================================================
             RIGHT : USER
             ===================================================== -->

    <div class="relative ml-3 shrink-0 lg:ml-0 lg:flex lg:justify-end">
      <button
        type="button"
        @click="userMenuOpen = !userMenuOpen"
        class="flex items-center gap-2 rounded-lg p-1 transition hover:bg-white/10 focus:outline-none sm:gap-3"
      >
        <!-- USER ICON -->

        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-xs font-semibold text-emerald-900 sm:h-11 sm:w-11 sm:text-sm"
        >
          {{ (current_user.first_name[:1] ~ current_user.last_name[:1]) | upper }}
        </div>

        <!-- USER DETAILS -->

        <div class="hidden text-left leading-tight sm:block">
          <div class="text-sm font-semibold text-white whitespace-nowrap">
            {{ current_user.first_name }} {{ current_user.last_name }}
          </div>

          <div class="mt-1 text-[10px] text-emerald-200 sm:text-[11px]">
            {{ current_user.role_id.value }}
          </div>
        </div>

        <!-- ARROW -->

        <svg
          class="h-4 w-4 shrink-0 text-white transition-transform"
          :class="{ 'rotate-180': userMenuOpen }"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m6 9 6 6 6-6"
          />
        </svg>
      </button>

      <!-- =================================================
                 DROPDOWN
                 ================================================= -->

      <div
        x-show="userMenuOpen"
        x-transition
        @click.outside="userMenuOpen = false"
        class="absolute right-0 top-14 z-50 w-52 overflow-hidden rounded-lg border border-slate-200 bg-white shadow-lg"
        style="display: none"
      >
        <form method="POST" action="/logout">
            <button
              type="button"
              @click="logout()"
              class="flex w-full items-center gap-3 px-4 py-3 text-left text-red-600 transition hover:bg-red-50"
            >
              <svg
                class="h-5 w-5"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012 2v1"
                />
              </svg>
              Logout
            </button>
        </form>
      </div>
    </div>
  </div>

  <!-- =========================================================
         MOBILE + TABLET NAVIGATION
         ========================================================= -->

  <nav class="border-t border-emerald-800 bg-white lg:hidden">
    <div class="flex w-full items-center">
      <!-- DASHBOARD -->

      <a
        href="/dashboard"
        class="flex h-11 flex-1 items-center justify-center text-xs font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-800 sm:text-sm"
      >
        Dashboard
      </a>

      <!-- PURCHASE BILL -->

      <a
        href="/purchase-bill"
        class="flex h-11 flex-1 items-center justify-center text-xs font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-800 sm:text-sm"
      >
        Purchase Bill
      </a>

      <!-- SELL BILL -->

      <a
        href="/sell-bill"
        class="flex h-11 flex-1 items-center justify-center text-xs font-medium text-slate-700 transition hover:bg-emerald-50 hover:text-emerald-800 sm:text-sm"
      >
        Sell Bill
      </a>
    </div>
  </nav>
</header>
